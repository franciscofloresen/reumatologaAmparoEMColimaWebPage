<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Panel de Administración</h1>
                    <p class="text-gray-600">Dra. María Amparo Enríquez Maldonado</p>
                </div>
                <button onclick="logout()" class="bg-red-600 text-white px-6 py-2 rounded-md hover:bg-red-700 transition-all duration-300">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Tabs -->
            <div class="mb-6 border-b border-gray-200">
                <nav class="flex space-x-8">
                    <button onclick="switchTab('reservations')" id="tabReservations" class="py-4 px-1 border-b-2 border-blue-600 font-medium text-blue-600">
                        Reservaciones
                    </button>
                    <button onclick="switchTab('testimonies')" id="tabTestimonies" class="py-4 px-1 border-b-2 border-transparent font-medium text-gray-500 hover:text-gray-700">
                        Testimonios
                    </button>
                </nav>
            </div>

            <!-- Reservations Section -->
            <div id="reservationsSection">
                <div class="mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">Gestión de Reservaciones</h2>
                </div>
                <div id="reservationsGrid" class="space-y-4">
                    <!-- Reservations will be loaded here -->
                </div>
            </div>

            <!-- Testimonies Section -->
            <div id="testimoniesSection" class="hidden">
                <div class="mb-6 flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">Gestión de Testimonios</h2>
                    <button onclick="openAddModal()" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700">+ Agregar Testimonio</button>
                </div>
                <div id="testimoniesGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Testimonies will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Testimony Modal -->
    <div id="testimonyModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg max-w-2xl mx-4 w-full">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Agregar Testimonio</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <form id="testimonyForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del Paciente</label>
                    <input type="text" id="patientName" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Testimonio</label>
                    <textarea id="testimony" required rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Calificación (1-5)</label>
                    <input type="number" id="rating" min="1" max="5" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex space-x-4 pt-4">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700">Guardar</button>
                    <button type="button" onclick="closeModal()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-300">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://mpwzml63ql.execute-api.us-east-1.amazonaws.com';
        
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + sessionStorage.getItem('idToken')
            };
        }

        let testimonies = [];
        let editingId = null;

        // Tab switching
        function switchTab(tab) {
            if (tab === 'reservations') {
                document.getElementById('reservationsSection').classList.remove('hidden');
                document.getElementById('testimoniesSection').classList.add('hidden');
                document.getElementById('tabReservations').classList.add('border-blue-600', 'text-blue-600');
                document.getElementById('tabReservations').classList.remove('border-transparent', 'text-gray-500');
                document.getElementById('tabTestimonies').classList.remove('border-blue-600', 'text-blue-600');
                document.getElementById('tabTestimonies').classList.add('border-transparent', 'text-gray-500');
                loadReservations();
            } else {
                document.getElementById('reservationsSection').classList.add('hidden');
                document.getElementById('testimoniesSection').classList.remove('hidden');
                document.getElementById('tabTestimonies').classList.add('border-blue-600', 'text-blue-600');
                document.getElementById('tabTestimonies').classList.remove('border-transparent', 'text-gray-500');
                document.getElementById('tabReservations').classList.remove('border-blue-600', 'text-blue-600');
                document.getElementById('tabReservations').classList.add('border-transparent', 'text-gray-500');
                loadTestimonies();
            }
        }

        // Load reservations from DynamoDB
        async function loadReservations() {
            const grid = document.getElementById('reservationsGrid');
            grid.innerHTML = '<div class="text-center py-8 text-gray-500">Cargando reservaciones...</div>';

            try {
                const response = await fetch(`${API_URL}/appointments`, { headers: getAuthHeaders() });
                
                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }
                
                const appointments = await response.json();

                if (!appointments || appointments.length === 0) {
                    grid.innerHTML = '<div class="text-center py-12 text-gray-500">No hay reservaciones aún.</div>';
                    return;
                }

                grid.innerHTML = appointments.map(apt => `
                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h3 class="font-semibold text-gray-800 text-lg">${escapeHTML(apt.firstName) || ''} ${escapeHTML(apt.lastName) || ''} <span class="text-sm font-normal text-gray-500">(${escapeHTML(apt.consultationType) || 'Consulta'})</span></h3>
                                <p class="text-sm text-gray-600 mt-1">📧 ${escapeHTML(apt.email) || 'No proporcionado'}</p>
                                <p class="text-sm text-gray-600">📞 ${escapeHTML(apt.phone) || 'N/A'}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-semibold ${getStatusColor(apt.status)}">
                                ${getStatusText(apt.status)}
                            </span>
                        </div>
                        <div class="border-t pt-4 mt-4">
                            <p class="text-sm text-gray-700"><strong>Fecha preferida:</strong> ${escapeHTML(apt.preferredDate)}</p>
                            <p class="text-sm text-gray-700 mt-1"><strong>Hora preferida:</strong> ${escapeHTML(apt.preferredTime)}</p>
                            ${apt.reason ? `<p class="text-sm text-gray-600 mt-2 italic">"${escapeHTML(apt.reason)}"</p>` : ''}
                        </div>
                        <div class="flex space-x-2 mt-4">
                            ${apt.status === 'cancelled' 
                                ? `<button onclick="deleteReservation('${apt.reservationId}')" class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-900 text-sm">
                                    Eliminar
                                </button>`
                                : `<button onclick="updateStatus('${apt.reservationId}', 'confirmed')" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 text-sm">
                                    Confirmar
                                </button>
                                <button onclick="updateStatus('${apt.reservationId}', 'cancelled')" class="flex-1 bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 text-sm">
                                    Cancelar
                                </button>`
                            }
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = '<div class="text-center py-12 text-red-500">Error al cargar reservaciones</div>';
                console.error('Error loading reservations:', error);
            }
        }

        function getStatusColor(status) {
            const colors = {
                pending: 'bg-yellow-100 text-yellow-800',
                confirmed: 'bg-green-100 text-green-800',
                cancelled: 'bg-red-100 text-red-800'
            };
            return colors[status] || colors.pending;
        }

        function getStatusText(status) {
            const texts = {
                pending: 'Pendiente',
                confirmed: 'Confirmada',
                cancelled: 'Cancelada'
            };
            return texts[status] || 'Pendiente';
        }

        async function updateStatus(reservationId, status) {
            try {
                const response = await fetch(`${API_URL}/appointments/${reservationId}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    loadReservations();
                } else {
                    alert('Error al actualizar el estado');
                }
            } catch (error) {
                alert('Error al actualizar el estado');
                console.error('Error:', error);
            }
        }

        async function deleteReservation(reservationId) {
            if (!confirm('¿Estás seguro de eliminar esta reservación?')) return;

            try {
                const response = await fetch(`${API_URL}/appointments/${reservationId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    loadReservations();
                } else {
                    alert('Error al eliminar la reservación');
                }
            } catch (error) {
                alert('Error al eliminar la reservación');
                console.error('Error:', error);
            }
        }

        async function loadTestimonies() {
            const grid = document.getElementById('testimoniesGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">Cargando testimonios...</div>';
            
            try {
                // Not using auth headers because GET /testimonies is public
                const response = await fetch(`${API_URL}/testimonies`);
                testimonies = await response.json();
                
                if (!testimonies || testimonies.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No hay testimonios aún. Agrega el primero.</div>';
                    return;
                }

                grid.innerHTML = testimonies.map(testimony => `
                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-semibold text-gray-800">${escapeHTML(testimony.patientName)}</h3>
                                <div class="flex mt-1">
                                    ${generateStars(testimony.rating)}
                                </div>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="editTestimony('${testimony.id}')" class="text-blue-600 hover:text-blue-800">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                                <button onclick="deleteTestimony('${testimony.id}')" class="text-red-600 hover:text-red-800">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-gray-600 text-sm">${escapeHTML(testimony.testimony)}</p>
                        <p class="text-xs text-gray-400 mt-4">${escapeHTML(formatDate(testimony.date))}</p>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Error al cargar testimonios</div>';
                console.error('Error:', error);
            }
        }

        function generateStars(rating) {
            let stars = '';
            for (let i = 0; i < 5; i++) {
                stars += i < rating 
                    ? '<svg class="w-4 h-4 text-yellow-400 inline" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>'
                    : '<svg class="w-4 h-4 text-gray-300 inline" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
            }
            return stars;
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Agregar Testimonio';
            document.getElementById('testimonyForm').reset();
            document.getElementById('testimonyModal').classList.remove('hidden');
        }

        function editTestimony(id) {
            const testimony = testimonies.find(t => t.id === id);
            if (!testimony) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Editar Testimonio';
            document.getElementById('patientName').value = testimony.patientName;
            document.getElementById('testimony').value = testimony.testimony;
            document.getElementById('rating').value = testimony.rating;
            document.getElementById('testimonyModal').classList.remove('hidden');
        }

        async function deleteTestimony(id) {
            if (!confirm('¿Estás seguro de eliminar este testimonio?')) return;
            
            try {
                const response = await fetch(`${API_URL}/testimonies/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (response.ok) {
                    loadTestimonies();
                } else {
                    alert('Error al eliminar testimonio');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
        }

        function closeModal() {
            document.getElementById('testimonyModal').classList.add('hidden');
            editingId = null;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        document.getElementById('testimonyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const testimony = {
                id: editingId || Date.now().toString(),
                patientName: document.getElementById('patientName').value,
                testimony: document.getElementById('testimony').value,
                rating: parseInt(document.getElementById('rating').value),
                date: editingId ? testimonies.find(t => t.id === editingId)?.date || new Date().toISOString() : new Date().toISOString()
            };

            const url = editingId ? `${API_URL}/testimonies/${editingId}` : `${API_URL}/testimonies`;
            const method = editingId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(testimony)
                });

                if (response.ok) {
                    closeModal();
                    loadTestimonies();
                } else {
                    alert('Error al guardar testimonio');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
        });

        // Load reservations on page load
        loadReservations();

        // Logout function
        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('accessToken');
            sessionStorage.removeItem('idToken');
            window.location.href = 'login.html';
        }

        // Check if user is logged in with valid token
        const accessToken = sessionStorage.getItem('accessToken');
        if (!accessToken || sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
